function parseCSV(text){
  const rows=[]; let i=0, field='', row=[], inQuotes=false;
  const pushField=()=>{row.push(field);field='';};
  const pushRow=()=>{pushField();rows.push(row);row=[];};
  while(i<text.length){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQuotes=false;i++;continue; }
      field+=c;i++;continue;
    } else {
      if(c==='"'){inQuotes=true;i++;continue;}
      if(c===','){pushField();i++;continue;}
      if(c==='\r'){i++;continue;}
      if(c==='\n'){pushRow();i++;continue;}
      field+=c;i++;continue;
    }
  }
  if(field.length||row.length){pushRow();}
  if(rows.length && rows[rows.length-1].every(v=>v==='')) rows.pop();
  const headers=rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(v=>v!=='')).map(r=>{
    const obj={}; headers.forEach((h,idx)=>obj[h]=(r[idx]!==undefined?r[idx].trim():'')); return obj;
  });
}
function get(row,...keys){ for(const k of keys){ if(row[k]!==undefined) return row[k]; } return ''; }
function toNumber(v){
  if(v===undefined||v===null) return 0;
  let s=String(v).trim();
  if(s===''||s==='-') return 0;
  let neg=false;
  if(s[0]==='(' && s[s.length-1]===')'){ neg=true; s=s.slice(1,-1).trim(); }
  s=s.replace(/\$/g,'').replace(/%/g,'').trim();
  if(s===''||s==='-') return 0;
  s=s.replace(/\./g,'').replace(/,/g,'.');
  const n=parseFloat(s);
  if(isNaN(n)) return 0;
  return neg?-n:n;
}
/* Formato chileno: punto para miles, coma para decimales */
function clp(n){ const neg=n<0; return (neg?'-':'')+'$'+Math.round(Math.abs(n)).toLocaleString('es-CL'); }
function pct(n,d=1){ return n.toLocaleString('es-CL',{minimumFractionDigits:d,maximumFractionDigits:d})+'%'; }

async function fetchCSV(url, fallback){
  if(url && url.trim()){
    try{ const res=await fetch(url,{cache:'no-store'}); if(!res.ok) throw new Error('bad'); return parseCSV(await res.text()); }
    catch(e){ console.warn('CSV fetch failed, using fallback:',e); return parseCSV(fallback); }
  }
  return parseCSV(fallback);
}

function semaforo(row){
  if(row['Estado']==='Vendido') return {hex:'#9AA1AC', label:'Vendido', days:'Vendido', rank:3};
  const start=new Date((row['Fecha_Compra']||'').replace(/\//g,'-'));
  const days=Math.floor((new Date()-start)/86400000);
  if(days<=30) return {hex:'#16C784', label:days+' días en stock', days:days+' días', rank:2};
  if(days<=60) return {hex:'#F5A524', label:days+' días — riesgo de estancamiento', days:days+' días', rank:1};
  return {hex:'#F0453A', label:days+' días — estancado', days:days+' días', rank:0};
}

  currentView=view;

function renderInvestor(){
  const name=document.getElementById('investorSelect').value || '__all__';
  const totalEl=document.getElementById('investorTotal');
  const roiEl=document.getElementById('investorRoi');
  const listEl=document.getElementById('investorList');

  if(name==='__all__'){
    const sold = DATA.historico.filter(r=>r['Estado']==='Vendido');
    const utilidad = sold.reduce((s,r)=>s+toNumber(r['Utilidad_Fondo']),0);
    const inversion = sold.reduce((s,r)=>s+toNumber(get(r,'Monto _Inversión','Monto_Inversión')),0);
    totalEl.textContent = clp(utilidad);
    roiEl.textContent = inversion>0 ? pct(utilidad/inversion*100)+' sobre capital vendido' : '';
    listEl.innerHTML = DATA.historico.map(r=>{
      const s=semaforo(r);
      const compra=toNumber(r['Gasto_Compra']), venta=toNumber(r['Monto_Venta']), utilidadCar=toNumber(r['Utilidad_Fondo']);
      const comision=toNumber(get(r,'Utilidad_Celcar','Utilidad_Sellcar'));
      return investorCard(r['Marca']+' '+r['Modelo'], r['ID_Ronda'], compra, venta, utilidadCar, s, r['Estado']==='Vendido', comision);
    }).join('');
  } else {
    const rows=DATA.autos.filter(r=>r['Aportante']===name);
    const soldRows=rows.filter(r=>r['Estado']==='Vendido');
    const utilidad=soldRows.reduce((s,r)=>s+toNumber(r['Utilidad_Fondo_Asignada']),0);
    const inversion=soldRows.reduce((s,r)=>s+toNumber(r['Inversion_Asignada']),0);
    totalEl.textContent = clp(utilidad);
    roiEl.textContent = inversion>0 ? pct(utilidad/inversion*100)+' sobre su capital vendido' : '';
    listEl.innerHTML = rows.map(r=>{
      const s=semaforo(r);
      const compra=toNumber(r['Inversion_Asignada']), venta=toNumber(r['Venta_Asignada']), utilidadCar=toNumber(r['Utilidad_Fondo_Asignada']);
      const comision=toNumber(r['Utilidad_Bruta_Asignada'])-utilidadCar;
      return investorCard(r['Marca']+' '+r['Modelo'], r['ID_Ronda'], compra, venta, utilidadCar, s, r['Estado']==='Vendido', comision);
    }).join('');
  }
}

function investorCard(name, ronda, compra, venta, utilidad, s, vendido, comision){

    ventaTxt = clp(venta);
    utilidadTxt = clp(utilidad);
    utilidadColor = '#00FF87';
    badgeColor = '#00FF87';
  } else {

    utilidadTxt = '-';
    utilidadColor = '#FFFFFF';

  return `

        <div><p class="text-[#7C828D] text-[10px] uppercase">Compra</p><p class="text-white text-xs font-medium mt-1">${clp(compra)}</p></div>
        <div><p class="text-[#7C828D] text-[10px] uppercase">Venta</p><p class="text-white text-xs font-medium mt-1">${ventaTxt}</p></div>
        <div><p class="text-[#7C828D] text-[10px] uppercase">Utilidad</p><p class="text-xs font-bold mt-1" style="color:${utilidadColor}">${utilidadTxt}</p></div>
      </div>
      <p class="text-[#7C828D] text-[11px] mt-3">${s.label}</p>
    </div>`;
}

          <div><p class="text-[#667085] text-[9px] uppercase">Gastos</p><p class="text-[#F0453A] text-[11px] font-medium mt-0.5">${clp(gastos)}</p></div>
          <div><p class="text-[#667085] text-[9px] uppercase">Venta</p><p class="text-[#0B0E14] text-[11px] font-medium mt-0.5">${clp(venta)}</p></div>
          <div><p class="text-[#667085] text-[9px] uppercase">Margen</p><p class="text-[#0B0E14] text-[11px] font-medium mt-0.5">${clp(margen)}</p></div>
          <div><p class="text-[#667085] text-[9px] uppercase">Rent.</p><p class="text-[#0057FF] text-[11px] font-bold mt-0.5">${pct(rentabilidad)}</p></div>
        </div>`:`
        <div class="grid grid-cols-2 gap-2 text-center pt-1">
          <div><p class="text-[#667085] text-[10px] uppercase">Compra</p><p class="text-[#0B0E14] text-xs font-medium mt-0.5">${clp(monto)}</p></div>
          <div><p class="text-[#667085] text-[10px] uppercase">Publicado</p><p class="text-[#0B0E14] text-xs font-medium mt-0.5">${publicado>0?clp(publicado):'-'}</p></div>
        </div>`}
      </div>`;
  }).join('');
}

async function loadData(){
  const [historico, autos] = await Promise.all([
    fetchCSV(CONFIG.historicoCSV, FALLBACK_HISTORICO),
    fetchCSV(CONFIG.autosCSV, FALLBACK_AUTOS)
  ]);
  DATA={
    historico: historico.filter(r=>r['ID_Ronda'] && r['ID_Ronda']!=='#N/A'),
    autos: autos.filter(r=>r['Aportante'] && r['Aportante']!=='#N/A' && r['ID_Ronda']!=='#N/A')
  };
  populateInvestorSelect();
  showView(currentView);
}
loadData();
setInterval(loadData, 60000);
</script>
