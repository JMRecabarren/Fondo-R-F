<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas — Dashboard</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: -apple-system, 'Inter', 'Helvetica Neue', Arial, sans-serif; }
  #app { max-width: 480px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  .fdd { position: relative; display: inline-block; }
  .fdd summary { list-style: none; cursor: pointer; font-size: 12px; padding: 5px 10px; border-radius: 7px; border: 1px solid #E5E7EB; background: #fff; color: #111827; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .fdd summary::-webkit-details-marker { display: none; }
  .fdd[open] summary { border-color: #9CA3AF; }
  .fdd-panel { position: absolute; top: calc(100% + 5px); left: 0; z-index: 10; background: #fff; border: 1px solid #E5E7EB; border-radius: 10px; padding: 8px 10px; min-width: 210px; box-shadow: 0 6px 20px rgba(17,24,39,0.10); max-height: 260px; overflow-y: auto; }
  .fdd-toolbar { display: flex; gap: 10px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid #F0F0F1; }
  .fdd-toolbar button { font-size: 11px; color: #374151; background: #F3F4F6; border: none; border-radius: 5px; padding: 3px 8px; cursor: pointer; }
  .fdd-toolbar button:hover { background: #E5E7EB; }
  .fdd-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #374151; padding: 3px 0; }
  .fdd-row .lbl { flex: 1; }
  .fdd-row .solo { font-size: 10px; color: #9CA3AF; cursor: pointer; text-decoration: underline; white-space: nowrap; }
  .fdd-row .solo:hover { color: #374151; }
  .fdd-group-title { font-size: 9px; letter-spacing: 0.05em; text-transform: uppercase; color: #9CA3AF; margin: 7px 0 2px; }
  .fdd-group-title:first-child { margin-top: 0; }
  .fdd-row input { accent-color: #374151; }

  .yearsel { font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid #E5E7EB; background: #fff; color: #111827; }

  .monthrow { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; margin: 8px 0 6px; -webkit-overflow-scrolling: touch; }
  .monthrow::-webkit-scrollbar { height: 4px; }
  .monthcard {
    flex: 0 0 auto; min-width: 40px; text-align: center; font-size: 12px; font-weight: 600;
    padding: 8px 4px; border-radius: 9px; border: 1px solid #E5E7EB; background: #FAFAFA; color: #9CA3AF;
    cursor: pointer; user-select: none;
  }
  .monthcard.active { background: #111827; border-color: #111827; color: #fff; }
  .monthcard.disabled { color: #D1D5DB; cursor: not-allowed; background: #FCFCFD; }
  .monthquick { display: flex; gap: 8px; margin-bottom: 1.2rem; }
  .monthquick button { font-size: 11px; color: #374151; background: #F3F4F6; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .monthquick button:hover { background: #E5E7EB; }

  .kpi { border-radius: 10px; padding: 0.6rem 0.45rem; min-width: 0; }
  .kpi p.label { font-size: 8px; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 4px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi p.value { font-size: 13px; font-weight: 700; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .section-title { font-size: 11px; letter-spacing: 0.03em; text-transform: uppercase; color: #6B7280; margin: 0 0 8px; font-weight: 600; }

  .detail-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: #374151; margin: 12px 0 3px; }
  .detail-cat:first-child { margin-top: 0; }
  .detail-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #F3F4F6; }
  .detail-row .d-fecha { flex: 0 0 32px; color: #9CA3AF; font-size: 10px; }
  .detail-row .d-glosa { flex: 1; color: #374151; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-row .d-monto { flex: 0 0 auto; color: #B5453B; font-weight: 600; }
  .detail-empty { font-size: 12px; color: #9CA3AF; padding: 4px 0; }
  #detailTable { max-height: 420px; overflow-y: auto; }

  #status { font-size: 13px; color: #6B7280; padding: 2rem 0; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div id="status">Cargando datos del Sheet…</div>
  <div id="content" style="display:none;">

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;">
      <p style="font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; color: #9CA3AF; margin: 0;">Periodo</p>
      <select id="yearSelect" class="yearsel"></select>
    </div>
    <div class="monthrow" id="monthRow"></div>
    <div class="monthquick">
      <button id="btnAllMonths">Todo el año</button>
      <button id="btnNoMonths">Ninguno</button>
    </div>

    <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 1.1rem; flex-wrap: wrap;">
      <details class="fdd" id="catDD">
        <summary>Categoría <span id="catCount" style="color:#9CA3AF;">· Todas</span></summary>
        <div class="fdd-panel">
          <div class="fdd-toolbar"><button id="catAll">Todas</button><button id="catNone">Ninguna</button></div>
          <div id="catPanel"></div>
        </div>
      </details>

      <details class="fdd" id="subDD">
        <summary>Subcategoría <span id="subCount" style="color:#9CA3AF;">· Todas</span></summary>
        <div class="fdd-panel">
          <div class="fdd-toolbar"><button id="subAll">Todas</button><button id="subNone">Ninguna</button></div>
          <div id="subPanel"></div>
        </div>
      </details>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 1.4rem;">
      <div class="kpi" style="background: #FBEEEC;">
        <p class="label" style="color:#B5453B;">Gasto</p>
        <p class="value" id="kpiGasto" style="color:#B5453B;">—</p>
      </div>
      <div class="kpi" style="background: #EAF3EE;">
        <p class="label" style="color:#3E7A56;">Ingreso</p>
        <p class="value" id="kpiIngreso" style="color:#3E7A56;">—</p>
      </div>
      <div class="kpi" style="background: #374151;">
        <p class="label" style="color:#D1D5DB;">Ahorro</p>
        <p class="value" id="kpiAhorro" style="color:#fff;">—</p>
      </div>
      <div class="kpi" id="kpiDesvCard" style="background: #FBEEEC;">
        <p class="label" id="kpiDesvLabel" style="color:#B5453B;">Vs. Presu.</p>
        <p class="value" id="kpiDesv" style="color:#B5453B;">—</p>
      </div>
    </div>

    <p class="section-title">Gasto Real V/S Presupuesto</p>
    <div style="position: relative; height: 190px; margin-bottom: 0.4rem;">
      <canvas id="stackedCatChart"></canvas>
    </div>

    <p class="section-title">Ranking de Gastos</p>
    <div style="position: relative; height: 210px; margin-bottom: 1.6rem;">
      <canvas id="rankChart"></canvas>
    </div>

    <p class="section-title">Detalle de Gastos</p>
    <div id="detailTable"></div>

    <p id="uncatNote" style="font-size: 11px; color: #B0B5BC; margin-top: 1.2rem; display:none;"></p>
    <p id="arriendoNote" style="font-size: 11px; color: #B0B5BC; margin-top: 0.4rem; display:none;"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMLMr2pGrS2hAfaaCsOw6dE5S0BjGfG8JQurCvLUSGQVwncycptUmZwHtr0hrhuCWtksKSVDbvNxVn/pub?single=true&output=csv&gid=";
const GID = { D: "422426543", C: "0", I: "1295296830", P: "1156383057", R: "815960230" };

const RED = "#B5453B";
const GREEN = "#3E7A56";
const CHARCOAL = "#374151";
const INK = "#111827";
// Paleta de gasto: siempre en tonos rojos (una sombra distinta por categoría, todas dentro de la familia roja — incluida Deuda).
const PALETTE = ["#5C1A16","#7A241E","#96302A","#B5453B","#C15850","#CB6D64","#D48179","#DC9791","#E4ADA8","#EBC3BF","#F2D9D6"];
// Paleta de presupuesto: la misma familia gris azulada del Ahorro (sólida, sin transparencia), una sombra por categoría.
const PALETTE_PRESU = ["#0F172A","#1E293B","#29394D","#374151","#46566B","#566780","#687B95","#7C8FA8","#96A6BC","#B3BFCF","#D2D9E3"];
const MES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const MES_NUMS = ["01","02","03","04","05","06","07","08","09","10","11","12"];

const fmtK = n => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n) / 1000).toLocaleString("es-CL") + "k";

function parseCSV(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n").filter(l => l.length > 0);
  const rows = lines.map(line => {
    const fields = [];
    let cur = "", inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQ) {
        if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
        else cur += ch;
      } else {
        if (ch === '"') inQ = true;
        else if (ch === ",") { fields.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    fields.push(cur);
    return fields;
  });
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (r[i] || "").trim());
    return obj;
  });
}

function parseMonto(s) {
  if (!s) return 0;
  const neg = s.trim().startsWith("-");
  const digits = s.replace(/[^0-9]/g, "");
  const n = digits ? parseInt(digits, 10) : 0;
  return neg ? -n : n;
}

function fechaKey(s) {
  if (!s) return null;
  const parts = s.split("-").map(x => x.trim());
  if (parts.length !== 3) return null;
  let [d, m, y] = parts;
  if (y.length !== 4) return null;
  return y + "-" + m.padStart(2, "0");
}

function monthLabel(key) {
  const [y, m] = key.split("-");
  return MES[parseInt(m, 10) - 1] + " " + y.slice(2);
}

function shortDate(fechaStr) {
  const parts = (fechaStr || "").split("-").map(x => x.trim());
  if (parts.length !== 3) return "";
  const mi = parseInt(parts[1], 10) - 1;
  return parts[0] + " " + (MES[mi] || "");
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

async function loadCSV(gid) {
  const res = await fetch(SHEET_BASE + gid, { cache: "no-store" });
  if (!res.ok) throw new Error("No se pudo cargar gid " + gid);
  const text = await res.text();
  return parseCSV(text);
}

(async function init() {
  let D, C, I, P, R;
  try {
    [D, C, I, P, R] = await Promise.all([
      loadCSV(GID.D), loadCSV(GID.C), loadCSV(GID.I), loadCSV(GID.P), loadCSV(GID.R)
    ]);
  } catch (e) {
    document.getElementById("status").textContent = "No se pudieron cargar los datos. Revisa tu conexión o que el Sheet siga publicado.";
    return;
  }

  // --- mapa subcategoría -> {tipo, categoria} desde Reglas ---
  const map = {};
  const reglasByTipoCat = {};
  R.forEach(row => {
    const tipo = row["Tipo"], categoria = row["Categoría"], sub = row["Subcategoría"];
    if (!tipo || !categoria || !sub) return;
    map[sub.toLowerCase()] = { tipo, categoria };
    reglasByTipoCat[tipo] = reglasByTipoCat[tipo] || {};
    reglasByTipoCat[tipo][categoria] = reglasByTipoCat[tipo][categoria] || [];
    reglasByTipoCat[tipo][categoria].push(sub);
  });

  let uncatCount = 0;

  function joinRows(rows, montoField, origen) {
    const out = [];
    rows.forEach(row => {
      const glosa = (row["glosa"] || "").trim();
      if (origen === "Internacional" && glosa.toUpperCase() === "TRASPASO DEUDA INTERNACIONAL") return;
      const sub = (row["subcategoria"] || "").trim();
      const fechaRaw = row["fecha"];
      const month = fechaKey(fechaRaw);
      if (!month) return;
      if (!sub) { uncatCount++; return; }
      const hit = map[sub.toLowerCase()];
      if (!hit) { uncatCount++; return; }
      const monto = parseMonto(row[montoField]);
      out.push({ month, tipo: hit.tipo, categoria: hit.categoria, subcategoria: sub, monto, glosa, fecha: fechaRaw });
    });
    return out;
  }

  const txns = [
    ...joinRows(D, "monto", "Débito"),
    ...joinRows(C, "monto", "Crédito"),
    ...joinRows(I, "monto_usd", "Internacional")
  ];

  const presu = [];
  P.forEach(row => {
    const sub = (row["subcategoria"] || "").trim();
    const month = fechaKey(row["Fecha"] || row["fecha"]);
    if (!month || !sub) return;
    const hit = map[sub.toLowerCase()];
    if (!hit) return;
    presu.push({ month, tipo: hit.tipo, categoria: hit.categoria, subcategoria: sub, monto: parseMonto(row["monto"]) });
  });

  if (txns.length === 0) {
    document.getElementById("status").textContent = "No hay movimientos categorizados todavía en el Sheet.";
    return;
  }

  // --- meses/años disponibles ---
  const monthSet = new Set([...txns.map(t => t.month), ...presu.map(t => t.month)]);
  const MONTHS = Array.from(monthSet).sort();
  const YEARS = Array.from(new Set(MONTHS.map(m => m.split("-")[0]))).sort();

  // --- categorías de Gasto (para filtros y gráficos) ---
  const gastoCatMap = reglasByTipoCat["Gasto"] || {};
  const catNames = Object.keys(gastoCatMap).sort();
  const CAT_COLORS = {};
  const CAT_COLORS_PRESU = {};
  catNames.forEach((c, i) => {
    CAT_COLORS[c] = PALETTE[i % PALETTE.length];
    CAT_COLORS_PRESU[c] = PALETTE_PRESU[i % PALETTE_PRESU.length];
  });

  const selectedCats = new Set(catNames);
  const selectedSubs = {};
  catNames.forEach(c => selectedSubs[c] = new Set(gastoCatMap[c]));

  // --- neteo Arriendo vs Arriendo compartido ---
  function arriendoNetAdjustment(month) {
    return txns
      .filter(t => t.month === month && t.tipo === "Traspaso" && t.categoria === "Vivienda" && t.subcategoria === "Arriendo compartido")
      .reduce((s, t) => s + Math.abs(t.monto), 0);
  }
  const hasArriendoCompartido = txns.some(t => t.tipo === "Traspaso" && t.categoria === "Vivienda" && t.subcategoria === "Arriendo compartido");
  if (hasArriendoCompartido) {
    const note = document.getElementById('arriendoNote');
    note.style.display = 'block';
    note.textContent = "El gasto de Vivienda/Arriendo se muestra neto de lo que devuelven los roomies (Arriendo compartido).";
  }

  // --- filtro de periodo: año + tarjetas de mes ---
  const yearSelect = document.getElementById('yearSelect');
  YEARS.forEach(y => yearSelect.add(new Option(y, y)));
  let selectedYear = YEARS[YEARS.length - 1];
  const lastMonthOfYear = y => {
    const ms = MONTHS.filter(m => m.startsWith(y + "-"));
    return ms.length ? ms[ms.length - 1].split("-")[1] : MES_NUMS[0];
  };
  let selectedMonthNums = new Set([lastMonthOfYear(selectedYear)]);
  yearSelect.value = selectedYear;

  const monthRow = document.getElementById('monthRow');
  function buildMonthRow() {
    monthRow.innerHTML = '';
    MES_NUMS.forEach((mn, idx) => {
      const key = selectedYear + "-" + mn;
      const has = MONTHS.includes(key);
      const card = document.createElement('div');
      card.className = 'monthcard' + (selectedMonthNums.has(mn) ? ' active' : '') + (has ? '' : ' disabled');
      card.textContent = MES[idx];
      if (has) {
        card.addEventListener('click', () => {
          if (selectedMonthNums.has(mn)) selectedMonthNums.delete(mn); else selectedMonthNums.add(mn);
          buildMonthRow(); render();
        });
      }
      monthRow.appendChild(card);
    });
  }
  yearSelect.addEventListener('change', () => {
    selectedYear = yearSelect.value;
    selectedMonthNums = new Set([lastMonthOfYear(selectedYear)]);
    buildMonthRow(); render();
  });
  document.getElementById('btnAllMonths').addEventListener('click', () => {
    selectedMonthNums = new Set(MES_NUMS.filter(mn => MONTHS.includes(selectedYear + "-" + mn)));
    buildMonthRow(); render();
  });
  document.getElementById('btnNoMonths').addEventListener('click', () => {
    selectedMonthNums = new Set();
    buildMonthRow(); render();
  });

  function monthsInRange() {
    return Array.from(selectedMonthNums).map(mn => selectedYear + "-" + mn).filter(k => MONTHS.includes(k)).sort();
  }

  // --- panel categoría ---
  const catPanel = document.getElementById('catPanel');
  function buildCatPanel() {
    catPanel.innerHTML = '';
    catNames.forEach(c => {
      const row = document.createElement('div');
      row.className = 'fdd-row';
      const checked = selectedCats.has(c) ? 'checked' : '';
      row.innerHTML = `<input type="checkbox" data-cat="${c}" ${checked}><span class="lbl">${c}</span><span class="solo" data-solo-cat="${c}">solo</span>`;
      catPanel.appendChild(row);
    });
  }
  catPanel.addEventListener('change', e => {
    const cat = e.target.getAttribute('data-cat');
    if (!cat) return;
    if (e.target.checked) selectedCats.add(cat); else selectedCats.delete(cat);
    updateCatSummary(); buildSubPanel(); render();
  });
  catPanel.addEventListener('click', e => {
    const cat = e.target.getAttribute('data-solo-cat');
    if (!cat) return;
    selectedCats.clear(); selectedCats.add(cat);
    buildCatPanel(); updateCatSummary(); buildSubPanel(); render();
  });
  document.getElementById('catAll').addEventListener('click', () => {
    selectedCats.clear(); catNames.forEach(c => selectedCats.add(c));
    buildCatPanel(); updateCatSummary(); buildSubPanel(); render();
  });
  document.getElementById('catNone').addEventListener('click', () => {
    selectedCats.clear();
    buildCatPanel(); updateCatSummary(); buildSubPanel(); render();
  });

  function updateCatSummary() {
    document.getElementById('catCount').textContent = selectedCats.size === catNames.length ? '· Todas' : selectedCats.size === 0 ? '· Ninguna' : `· ${selectedCats.size} de ${catNames.length}`;
  }

  const subPanel = document.getElementById('subPanel');
  function buildSubPanel() {
    subPanel.innerHTML = '';
    catNames.filter(c => selectedCats.has(c)).forEach(c => {
      const title = document.createElement('div');
      title.className = 'fdd-group-title';
      title.textContent = c;
      subPanel.appendChild(title);
      gastoCatMap[c].forEach(s => {
        const row = document.createElement('div');
        row.className = 'fdd-row';
        const checked = selectedSubs[c].has(s) ? 'checked' : '';
        row.innerHTML = `<input type="checkbox" data-cat="${c}" data-sub="${s}" ${checked}><span class="lbl">${s}</span><span class="solo" data-solo-cat="${c}" data-solo-sub="${s}">solo</span>`;
        subPanel.appendChild(row);
      });
    });
    updateSubSummary();
  }
  subPanel.addEventListener('change', e => {
    const cat = e.target.getAttribute('data-cat'), sub = e.target.getAttribute('data-sub');
    if (!cat || !sub) return;
    if (e.target.checked) selectedSubs[cat].add(sub); else selectedSubs[cat].delete(sub);
    updateSubSummary(); render();
  });
  subPanel.addEventListener('click', e => {
    const cat = e.target.getAttribute('data-solo-cat'), sub = e.target.getAttribute('data-solo-sub');
    if (!cat || !sub) return;
    selectedCats.clear(); selectedCats.add(cat);
    catNames.forEach(cc => selectedSubs[cc] = new Set());
    selectedSubs[cat] = new Set([sub]);
    buildCatPanel(); updateCatSummary(); buildSubPanel(); render();
  });
  document.getElementById('subAll').addEventListener('click', () => {
    catNames.filter(c => selectedCats.has(c)).forEach(c => selectedSubs[c] = new Set(gastoCatMap[c]));
    buildSubPanel(); render();
  });
  document.getElementById('subNone').addEventListener('click', () => {
    catNames.filter(c => selectedCats.has(c)).forEach(c => selectedSubs[c] = new Set());
    buildSubPanel(); render();
  });

  function updateSubSummary() {
    const visCats = catNames.filter(c => selectedCats.has(c));
    const total = visCats.reduce((s, c) => s + gastoCatMap[c].length, 0);
    let sel = 0; visCats.forEach(c => sel += selectedSubs[c].size);
    document.getElementById('subCount').textContent = total === 0 ? '· —' : sel === total ? '· Todas' : sel === 0 ? '· Ninguna' : `· ${sel} de ${total}`;
  }

  buildCatPanel(); buildSubPanel(); updateCatSummary(); buildMonthRow();

  const fmt = n => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n)).toLocaleString("es-CL");

  function catValueReal(month, cat) {
    if (!selectedCats.has(cat) || selectedSubs[cat].size === 0) return 0;
    const subs = selectedSubs[cat];
    let total = txns
      .filter(t => t.month === month && t.tipo === "Gasto" && t.categoria === cat && subs.has(t.subcategoria))
      .reduce((s, t) => s + Math.abs(t.monto), 0);
    if (cat === "Vivienda" && subs.has("Arriendo")) total -= arriendoNetAdjustment(month);
    return total;
  }
  function catValuePresu(month, cat) {
    if (!selectedCats.has(cat) || selectedSubs[cat].size === 0) return 0;
    return presu
      .filter(p => p.month === month && p.tipo === "Gasto" && p.categoria === cat && selectedSubs[cat].has(p.subcategoria))
      .reduce((s, p) => s + Math.abs(p.monto), 0);
  }
  function visibleCats() { return catNames.filter(c => selectedCats.has(c) && selectedSubs[c].size > 0); }

  function gastoBrutoMes(m) {
    return txns.filter(t => t.month === m && t.tipo === "Gasto").reduce((s, t) => s + Math.abs(t.monto), 0);
  }
  function gastoNetoMes(m) {
    return gastoBrutoMes(m) - arriendoNetAdjustment(m);
  }
  function ingresoMes(m) {
    return txns.filter(t => t.month === m && t.tipo === "Ingreso").reduce((s, t) => s + t.monto, 0);
  }

  let stackedCatChart, rankChart;

  // Tabla de detalle: transacciones de Gasto del período/categorías visibles, agrupadas por categoría (orden de ranking) y ordenadas por monto.
  function buildDetailTable(months, orderedCats) {
    const container = document.getElementById('detailTable');
    container.innerHTML = '';
    if (months.length === 0 || orderedCats.length === 0) {
      container.innerHTML = '<p class="detail-empty">Selecciona un período y al menos una categoría.</p>';
      return;
    }
    let any = false;
    orderedCats.forEach(c => {
      const subs = selectedSubs[c];
      const rows = txns.filter(t => months.includes(t.month) && t.tipo === "Gasto" && t.categoria === c && subs.has(t.subcategoria));
      if (rows.length === 0) return;
      any = true;
      rows.sort((a, b) => Math.abs(b.monto) - Math.abs(a.monto));
      const catEl = document.createElement('div');
      catEl.className = 'detail-cat';
      catEl.textContent = c;
      container.appendChild(catEl);
      rows.forEach(t => {
        const row = document.createElement('div');
        row.className = 'detail-row';
        row.innerHTML = `<span class="d-fecha">${shortDate(t.fecha)}</span><span class="d-glosa">${escapeHtml(t.glosa) || '—'}</span><span class="d-monto">-${fmt(Math.abs(t.monto))}</span>`;
        container.appendChild(row);
      });
    });
    if (!any) container.innerHTML = '<p class="detail-empty">No hay movimientos de Gasto en este período/selección.</p>';
  }

  // Plugin: dibuja el monto dentro de la barra y el % afuera, para el ranking de gastos.
  const rankLabelsPlugin = {
    id: 'rankLabels',
    afterDatasetsDraw(chart) {
      if (chart.canvas.id !== 'rankChart') return;
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const dataset = chart.data.datasets[0];
      const total = dataset._total || 0;
      ctx.save();
      ctx.font = '600 10px -apple-system, Helvetica Neue, Arial, sans-serif';
      ctx.textBaseline = 'middle';
      meta.data.forEach((bar, i) => {
        const value = dataset.data[i];
        if (!value) return;
        const pct = total > 0 ? Math.round((value / total) * 100) : 0;
        const montoText = fmtK(value);
        const montoWidth = ctx.measureText(montoText).width;
        const fitsInside = (bar.x - bar.base) > montoWidth + 14;
        ctx.textAlign = fitsInside ? 'right' : 'left';
        ctx.fillStyle = fitsInside ? '#fff' : CHARCOAL;
        ctx.fillText(montoText, fitsInside ? (bar.x - 6) : (bar.x + 6), bar.y);
        ctx.textAlign = 'left';
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '500 9px -apple-system, Helvetica Neue, Arial, sans-serif';
        ctx.fillText(pct + '%', bar.x + (fitsInside ? 6 : montoWidth + 14), bar.y);
        ctx.font = '600 10px -apple-system, Helvetica Neue, Arial, sans-serif';
      });
      ctx.restore();
    }
  };

  function render() {
    const months = monthsInRange();
    const vCats = visibleCats();

    let gastoTotal = 0, ingresoTotal = 0;
    months.forEach(m => { gastoTotal += gastoNetoMes(m); ingresoTotal += ingresoMes(m); });
    const ahorroTotal = ingresoTotal - gastoTotal;

    document.getElementById('kpiGasto').textContent = fmt(gastoTotal);
    document.getElementById('kpiIngreso').textContent = fmt(ingresoTotal);
    document.getElementById('kpiAhorro').textContent = fmt(ahorroTotal);

    const catTotals = {}; vCats.forEach(c => catTotals[c] = months.reduce((s, m) => s + catValueReal(m, c), 0));

    // --- KPI: desviación de Gasto real vs Presupuesto, sobre las categorías/subcategorías visibles ---
    const realTotalVis = vCats.reduce((s, c) => s + catTotals[c], 0);
    const presuTotalVis = vCats.reduce((s, c) => s + months.reduce((ss, m) => ss + catValuePresu(m, c), 0), 0);
    const kpiDesvEl = document.getElementById('kpiDesv');
    const kpiDesvCard = document.getElementById('kpiDesvCard');
    const kpiDesvLabel = document.getElementById('kpiDesvLabel');
    if (presuTotalVis > 0) {
      const desvPct = ((realTotalVis - presuTotalVis) / presuTotalVis) * 100;
      const over = desvPct > 0;
      kpiDesvEl.textContent = (over ? '+' : '') + Math.round(desvPct) + '%';
      const color = over ? '#B5453B' : '#3E7A56';
      kpiDesvCard.style.background = over ? '#FBEEEC' : '#EAF3EE';
      kpiDesvEl.style.color = color;
      kpiDesvLabel.style.color = color;
    } else {
      kpiDesvEl.textContent = '—';
      kpiDesvCard.style.background = '#F3F4F6';
      kpiDesvEl.style.color = '#9CA3AF';
      kpiDesvLabel.style.color = '#9CA3AF';
    }

    if (stackedCatChart) stackedCatChart.destroy();
    stackedCatChart = new Chart(document.getElementById('stackedCatChart'), {
      data: {
        labels: months.map(monthLabel),
        datasets: [
          ...vCats.map(c => ({
            type: 'bar', label: c + ' (presupuesto)',
            data: months.map(m => catValuePresu(m, c)),
            backgroundColor: CAT_COLORS_PRESU[c], stack: 'presupuesto', borderRadius: 3, maxBarThickness: 22
          })),
          ...vCats.map(c => ({
            type: 'bar', label: c,
            data: months.map(m => catValueReal(m, c)),
            backgroundColor: CAT_COLORS[c], stack: 'gasto', borderRadius: 3, maxBarThickness: 22
          }))
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 9 }, padding: 8, color: '#374151', filter: item => !item.text.endsWith(' (presupuesto)') } } },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { font: { size: 9 }, color: '#6B7280' } },
          y: { stacked: true, grid: { color: '#F3F4F6' }, ticks: { font: { size: 9 }, color: '#9CA3AF', callback: v => Math.round(v/1000).toLocaleString('es-CL') + 'k' } }
        }
      }
    });

    const ranked = vCats.map(c => ({ c, v: catTotals[c] })).sort((a, b) => b.v - a.v);
    const rankTotal = ranked.reduce((s, r) => s + r.v, 0);
    if (rankChart) rankChart.destroy();
    rankChart = new Chart(document.getElementById('rankChart'), {
      type: 'bar',
      data: { labels: ranked.map(r => r.c), datasets: [{ data: ranked.map(r => r.v), backgroundColor: RED, borderRadius: 4, maxBarThickness: 16, _total: rankTotal }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 34 } },
        plugins: { legend: { display: false } },
        scales: { x: { display: false }, y: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#374151' } } }
      },
      plugins: [rankLabelsPlugin]
    });

    buildDetailTable(months, ranked.map(r => r.c));
  }

  if (uncatCount > 0) {
    const note = document.getElementById('uncatNote');
    note.style.display = 'block';
    note.textContent = `${uncatCount} movimiento(s) sin subcategoría reconocida — no se incluyen en los totales.`;
  }

  document.getElementById('status').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  render();
})();
</script>
</body>
</html>
